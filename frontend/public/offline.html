<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Smart Society</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f1117;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; color: #cbd5e1; }
        p { color: #94a3b8; max-width: 400px; line-height: 1.5; }
        button {
            margin-top: 20px;
            padding: 10px 24px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #4f46e5; }
    </style>
</head>
<body>
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 9.86a10.94 10.94 0 014.28-1.5M10.9 5.08A10.94 10.94 0 0119 8.5M1.42 9a10.84 10.84 0 013.25-2.2M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
    </svg>
    <h1>You're Offline</h1>
    <p>It seems like you've lost your internet connection. Please check your network and try again.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
